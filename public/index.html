<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6366f1">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@11/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/highlight.min.js"></script>
<title>备忘录</title>
</head>
<body>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<!-- 登录页 -->
<div class="login-page active" id="loginPage">
  <div class="login-card">
    <div class="logo">&#x1F4DD;</div>
    <h1>备忘录</h1>
    <p class="sub">登录以访问你的笔记</p>
    <div class="field"><label>用户名</label><input type="text" id="usernameInput" placeholder="输入用户名" autofocus></div>
    <div class="field"><label>密码</label><input type="password" id="passwordInput" placeholder="输入密码"></div>
    <button id="loginBtn">登 录</button>
    <div class="login-error" id="loginError">用户名或密码错误，请重试</div>
  </div>
</div>

<!-- 主页面 -->
<div class="app-page" id="appPage">
  <header class="header">
    <div class="header-left">
      <button class="btn-sidebar-toggle" id="btnSidebarToggle" title="侧边栏">☰</button>
      <h1>备忘录</h1>
    </div>
    <div class="header-right">
      <span class="user-tag" id="userDisplay"></span>
      <button id="btnTheme" title="切换明暗主题">🌓</button>
      <button id="btnExport" title="导出数据">导出</button>
      <button class="btn-admin" id="btnAdmin" style="display:none">用户管理</button>
      <button id="logoutBtn">退出</button>
    </div>
  </header>
  <div class="app-body">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <div class="btn-all-notes active" id="btnAllNotes">📂 全部笔记</div>
        <div style="margin-top:12px">
          <div class="folder-title-row">
            <h4>📁 目录</h4>
            <button class="btn-add-folder" id="btnAddRootFolder" title="新建目录">+</button>
          </div>
          <div class="folder-tree" id="folderTree"></div>
          <div class="btn-all-notes" id="btnUncategorized" style="font-weight:400;font-size:12px;margin-left:4px">未分类 <span id="uncategorizedCount">0</span></div>
        </div>
        <div style="margin-top:12px">
          <h4>🏷️ 标签 <span class="badge" id="tagCount">0</span></h4>
          <div class="tag-list" id="tagList"></div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="sidebar-section" id="historySection">
        <h4>📝 修改历史</h4>
        <div class="history-empty" id="historyEmpty">选择一条笔记查看历史</div>
        <div class="history-list" id="historyList"></div>
      </div>
    </aside>
    <!-- 主内容 -->
    <main class="main">
      <div class="toolbar">
        <div class="search-wrap"><input type="text" id="searchInput" placeholder="搜索笔记... (Ctrl+K)"></div>
        <span class="tag-filter-hint" id="tagFilterHint" style="display:none">
          🏷️ <span id="tagFilterLabel"></span> <span class="clear-tag" id="clearTagFilter">×</span>
        </span>
        <select id="sortSelect" style="padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:13px;background:var(--card-bg);color:var(--text);cursor:pointer;outline:none">
          <option value="updated-desc">最近修改</option>
          <option value="updated-asc">最早修改</option>
          <option value="created-desc">最近创建</option>
          <option value="created-asc">最早创建</option>
          <option value="title-asc">标题 A-Z</option>
          <option value="title-desc">标题 Z-A</option>
        </select>
        <label class="view-toggle" id="adminViewToggle" style="display:none">
          <input type="checkbox" id="chkAllNotes"> 查看全部
        </label>
        <button class="btn-new" id="btnNew">+ 新建笔记</button>
        <button style="padding:8px 16px;font-size:13px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card-bg);cursor:pointer;color:var(--text-secondary)" id="btnImport" title="导入 md/json/txt 文件">导入</button>
        <input type="file" id="fileInput" accept=".md,.json,.txt" multiple style="display:none">
      </div>
      <div class="notes-grid" id="notesGrid"></div>
    </main>
  </div>
</div>

<!-- 编辑弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>
      <span id="modalTitle">新建笔记</span>
      <button class="btn-expand" id="btnExpand" title="全屏查看">⛶</button>
    </h2>
    <div class="modal-meta">
      <label>标题</label>
      <input type="text" id="noteTitle" placeholder="给笔记起个标题">
      <label>所属目录</label>
      <select id="noteFolder"><option value="">（未分类）</option></select>
      <label>标签</label>
      <input type="text" id="noteTags" placeholder="用逗号分隔，如: 工作, 重要">
      <div class="tag-hint">用逗号分隔多个标签</div>
    </div>
    <label>内容 <span style="font-weight:400;font-size:11px;color:#999">（支持 Markdown）</span>
      <button type="button" id="btnPreviewToggle" style="float:right;padding:2px 10px;font-size:12px;border:1px solid var(--border);border-radius:4px;background:var(--card-bg);cursor:pointer;color:var(--text-secondary)">预览</button>
    </label>
    <div id="editorWrap">
      <textarea id="noteContent" placeholder="写下你想记录的内容...支持 Markdown 格式"></textarea>
      <div id="notePreview" style="display:none;min-height:150px;padding:12px;border:1.5px solid var(--border);border-radius:var(--radius);line-height:1.7;overflow-y:auto;max-height:500px;background:var(--bg)"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-delete" id="btnDelete" style="display:none">删除</button>
      <button class="btn-cancel" id="btnCancel">取消</button>
      <button class="btn-save" id="btnSave">保存 (Ctrl+S)</button>
    </div>
  </div>
</div>

<!-- 历史预览弹窗 -->
<div class="modal-overlay" id="historyModalOverlay">
  <div class="modal">
    <h2>历史版本</h2>
    <div class="history-preview">
      <label>标题</label>
      <div class="hp-content" id="hpTitle"></div>
      <label>内容</label>
      <div class="hp-content" id="hpContent"></div>
      <label>保存时间</label>
      <div class="hp-content" id="hpTime"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnHistoryClose">关闭</button>
      <button class="btn-save" id="btnRestore">恢复此版本</button>
    </div>
  </div>
</div>

<!-- 管理员面板 -->
<div class="modal-overlay" id="adminModalOverlay">
  <div class="modal" style="max-width:620px">
    <h2>用户管理</h2>
    <div id="adminUserTable"></div>
    <div class="admin-error" id="adminError"></div>
    <div class="admin-create">
      <div><label>用户名</label><input type="text" id="newUsername" placeholder="新用户名"></div>
      <div><label>密码</label><input type="password" id="newPassword" placeholder="至少4位"></div>
      <button id="btnCreateUser">创建</button>
    </div>
    <div class="modal-actions" style="margin-top:18px"><button class="btn-cancel" id="btnAdminClose">关闭</button></div>
  </div>
</div>

<!-- 右键菜单 -->
<div class="context-menu" id="contextMenu">
  <button class="ctx-item" data-action="new-folder">+ 新建子目录</button>
  <button class="ctx-item" data-action="rename">重命名</button>
  <div class="ctx-divider"></div>
  <button class="ctx-item danger" data-action="delete-folder">删除目录</button>
</div>

<!-- 导出弹窗 -->
<div class="modal-overlay" id="exportModalOverlay">
  <div class="modal" style="max-width:440px">
    <h2>导出数据</h2>
    <label>格式</label>
    <select id="exportFormat">
      <option value="md">Markdown（可阅读，推荐）</option>
      <option value="json">JSON（数据备份）</option>
    </select>
    <label>范围</label>
    <select id="exportScope">
      <option value="my">我的全部笔记</option>
      <option value="current" id="exportScopeCurrent" disabled>当前选中的笔记</option>
      <option value="all" id="exportScopeAll" style="display:none">全部用户笔记（管理员）</option>
    </select>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnExportCancel">取消</button>
      <button class="btn-save" id="btnExportConfirm">导出</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
